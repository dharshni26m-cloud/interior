{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DreamSpace AI | Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/login_selection.css' %}">

</head>

<body>

<div class="container py-5">

    <div class="text-center mb-5">

        <h1>Choose Your Login</h1>

        <p class="text-muted">
            Select your role to continue
        </p>

    </div>

    <div class="row g-4">

        <!-- Customer -->

        <div class="col-md-4">

            <div class="card login-card h-100">

                <div class="card-body text-center">

                    <i class="bi bi-person-circle display-3 text-primary"></i>

                    <h3 class="mt-3">Customer</h3>

                    <p>
                        Explore interior designs and book designers.
                    </p>

                    <a href="{% url 'customer_login' %}" class="btn btn-primary w-100">
                        Continue
                    </a>

                </div>

            </div>

        </div>

        <!-- Designer -->

        <div class="col-md-4">

            <div class="card login-card h-100">

                <div class="card-body text-center">

                    <i class="bi bi-palette-fill display-3 text-success"></i>

                    <h3 class="mt-3">Designer</h3>

                    <p>
                        Manage projects and connect with customers.
                    </p>

                    <a href="{% url 'designer_login' %}" class="btn btn-success w-100">
                        Continue
                    </a>

                </div>

            </div>

        </div>

        <!-- Admin -->

        <div class="col-md-4">

            <div class="card login-card h-100">

                <div class="card-body text-center">

                    <i class="bi bi-shield-lock-fill display-3 text-danger"></i>

                    <h3 class="mt-3">Admin</h3>

                    <p>
                        Manage users, designers and the system.
                    </p>

                    <a href="{% url 'admin_login' %}" class="btn btn-danger w-100">
                        Continue
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
