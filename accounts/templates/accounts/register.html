{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DreamSpace AI | {{ role }} Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">

</head>

<body>

<div class="container-fluid">

    <div class="row g-0">

        <!-- Left Side -->
        <div class="col-lg-6 left-side">

            <div class="brand-content">

                <h1>DreamSpace AI</h1>

                <p>
                    Design your dream home with the power of Artificial Intelligence.
                </p>

            </div>

        </div>

        <!-- Right Side -->
        <div class="col-lg-6 right-side">

            <div class="login-card">

                <div class="login-header">

                    <h2>Create {{ role }} Account 🏡</h2>

                    <p>Create your DreamSpace AI {{ role }} account</p>

                </div>

                <!-- Registration Form -->
                <form id="registerForm" method="POST">

                    {% csrf_token %}

                    <!-- Full Name -->
                    <div class="form-group">

                        <label>Full Name</label>

                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>

                            <input
                                type="text"
                                id="fullName"
                                name="name"
                                class="form-control"
                                placeholder="Enter your full name">

                        </div>

                        <span class="error" id="fullNameError"></span>

                    </div>

                    <!-- Email -->
                    <div class="form-group">

                        <label>Email Address</label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email">

                        </div>

                        <span class="error" id="emailError"></span>

                    </div>

                    <!-- Phone -->
                    <div class="form-group">

                        <label>Phone Number</label>

                        <div class="input-box">

                            <i class="fa-solid fa-phone"></i>

                            <input
                                type="text"
                                id="phone"
                                name="phone"
                                class="form-control"
                                placeholder="Enter your phone number">

                        </div>

                        <span class="error" id="phoneError"></span>

                    </div>

                    <!-- Password -->
                    <div class="form-group">

                        <label>Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a password">

                            <i class="fa-solid fa-eye eye-icon"></i>

                        </div>

                        <span class="error" id="passwordError"></span>

                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label>Confirm Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm your password">

                            <i class="fa-solid fa-eye eye-icon"></i>

                        </div>

                        <span class="error" id="confirmPasswordError"></span>

                    </div>

                    <!-- Register Button -->
                    <button type="submit" class="btn login-btn w-100">
                        Register
                    </button>

                    <!-- Login Link -->
                    <p class="register-text">

                        Already have an account?

                        <a href="{% url 'customer_login' %}">Login</a>

                    </p>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Register JavaScript -->
<script src="{% static 'js/register.js' %}"></script>

</body>

</html>
